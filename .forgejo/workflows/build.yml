name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach assets to (leave empty for a plain build)'
        required: false
        default: ''
  release:
    types:
      - published

jobs:
  build:
    runs-on: docker
    container:
      image: node:20-bookworm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci || npm install

      - name: Validate ES5 syntax, generated scripts & package metadata
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Build IPK package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          npm run package

      - name: Generate Homebrew manifest
        shell: bash
        run: |
          set -euo pipefail
          node tools/gen-manifest.js build/nl.timsas.jellyfin.multiuser.manifest.json
          ls -l build
          sha256sum build/*.ipk

      - name: Upload build artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: jellyfin-webos
          path: build/*

      - name: Attach assets to release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          auth="Authorization: token ${TOKEN}"

          release_json=$(curl -fsS -H "$auth" "${API}/releases/tags/${RELEASE_TAG}")
          release_id=$(printf '%s' "$release_json" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).id))')
          echo "Release ${RELEASE_TAG} has id ${release_id}"

          for file in build/*.ipk build/*.manifest.json; do
            name=$(basename "$file")
            # Replace an existing asset with the same name so the IPK and the
            # manifest hash always come from the same build.
            existing=$(printf '%s' "$release_json" | NAME="$name" node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const a=(JSON.parse(d).assets||[]).find(x=>x.name===process.env.NAME);console.log(a?a.id:"")})')
            if [ -n "$existing" ]; then
              echo "Deleting existing asset ${name} (${existing})"
              curl -fsS -X DELETE -H "$auth" "${API}/releases/${release_id}/assets/${existing}"
            fi
            echo "Uploading ${name}"
            curl -fsS -X POST -H "$auth" \
              -F "attachment=@${file}" \
              "${API}/releases/${release_id}/assets?name=${name}" > /dev/null
          done

          echo "IPK sha256:"
          sha256sum build/*.ipk

      - name: Mirror to GitHub (OudeKaas69/jellyfin-multiuser)
        if: ${{ secrets.GH_MIRROR_TOKEN != '' }}
        shell: bash
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO: OudeKaas69/jellyfin-multiuser
        run: |
          set -euo pipefail
          git fetch --unshallow 2>/dev/null || true
          git fetch origin master:refs/remotes/origin/master 2>/dev/null || true
          git push --force "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/${GH_REPO}.git" HEAD:refs/heads/master

          if [ -n "${RELEASE_TAG}" ]; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force 2>/dev/null || true
            git push --force "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/${GH_REPO}.git" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

            gh_api="https://api.github.com/repos/${GH_REPO}"
            gh_auth="Authorization: Bearer ${GH_MIRROR_TOKEN}"
            gh_accept="Accept: application/vnd.github+json"

            release_json=$(curl -sS -H "$gh_auth" -H "$gh_accept" "${gh_api}/releases/tags/${RELEASE_TAG}" || true)
            release_id=$(printf '%s' "$release_json" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);console.log(j.id||"")}catch(e){console.log("")}})')

            if [ -z "$release_id" ]; then
              echo "Creating GitHub release ${RELEASE_TAG}..."
              create_payload=$(TAG="$RELEASE_TAG" node -e 'console.log(JSON.stringify({tag_name:process.env.TAG,name:"Jellyfin-Multiuser "+process.env.TAG,draft:false,prerelease:false}))')
              release_json=$(curl -fsS -X POST -H "$gh_auth" -H "$gh_accept" \
                -d "$create_payload" \
                "${gh_api}/releases")
              release_id=$(printf '%s' "$release_json" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).id))')
            fi

            echo "GitHub Release ${RELEASE_TAG} has id ${release_id}"
            for file in build/*.ipk build/*.manifest.json; do
              name=$(basename "$file")
              existing=$(printf '%s' "$release_json" | NAME="$name" node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const a=(JSON.parse(d).assets||[]).find(x=>x.name===process.env.NAME);console.log(a?a.id:"")})')
              if [ -n "$existing" ]; then
                echo "Deleting existing GitHub asset ${name} (${existing})"
                curl -fsS -X DELETE -H "$gh_auth" -H "$gh_accept" "${gh_api}/releases/assets/${existing}"
              fi
              echo "Uploading ${name} to GitHub Release"
              curl -fsS -X POST -H "$gh_auth" -H "$gh_accept" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@${file}" \
                "https://uploads.github.com/repos/${GH_REPO}/releases/${release_id}/assets?name=${name}" > /dev/null
            done
          fi
